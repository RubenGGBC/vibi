<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibi — Cara</title>
<style>
  /* ============================================
     La cara de Vibi v3 — ahora en 3D (Three.js)
     Estados: idle · listening · thinking · speaking
     ============================================ */
  :root {
    --noche: #0d0b14;
    --pelaje: #16121f;
    --borde: #6d5bd0;
    --lavanda: #a78bfa;
    --lavanda-suave: #d6c9ff;
    --rosa: #f0abfc;
    --rubor: #c084fc;
    --texto: #e9e4f5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse 80% 60% at 50% 30%, #171226 0%, var(--noche) 65%);
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
    color: var(--texto); overflow: hidden;
  }

  .escenario { position: relative; width: min(82vmin, 500px); aspect-ratio: 1; }

  /* el halo sigue siendo CSS: vive detrás del canvas */
  .halo {
    position: absolute; inset: 4%; border-radius: 50%;
    background: radial-gradient(circle, rgba(167,139,250,.15) 0%, transparent 62%);
    transition: opacity .6s ease, transform .6s ease;
  }
  .escenario.listening .halo { opacity: 1; transform: scale(1.1); }
  .escenario.thinking  .halo { opacity: .7; }

  .escenario canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  .sin-webgl {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; padding: 2rem; line-height: 1.6; color: #9a8fbe; font-size: .9rem;
  }

  /* ---------- demo ---------- */
  .demo { display: flex; gap: .6rem; font-size: .82rem; letter-spacing: .06em; }
  .demo button {
    background: transparent; color: var(--texto);
    border: 1px solid #2c2440; border-radius: 999px;
    padding: .55rem 1.2rem; cursor: pointer; font: inherit; transition: all .25s ease;
  }
  .demo button:hover  { border-color: var(--borde); }
  .demo button.activo { background: var(--lavanda); color: var(--noche); border-color: var(--lavanda); font-weight: 600; }
  .estado-label { font-size: .7rem; letter-spacing: .35em; text-transform: uppercase; color: #7d729c; margin-bottom: -2rem; }
</style>
</head>
<body>

<p class="estado-label" id="etiqueta">idle</p>

<div class="escenario" id="escenario">
  <div class="halo"></div>
</div>

<nav class="demo" aria-label="Estados de Vibi">
  <button data-estado="idle" class="activo">Idle</button>
  <button data-estado="listening">Escuchando</button>
  <button data-estado="thinking">Pensando</button>
  <button data-estado="speaking">Hablando</button>
</nav>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   Paleta — los mismos tonos que las variables CSS.
   El pelaje se aclara un poco respecto al SVG (#16121f) porque
   el sombreado toon necesita algo de rango para que se lean las
   bandas; la silueta oscura sobre el fondo noche no cambia.
   ============================================================ */
const PALETA = {
  pelaje:       0x2a2240,
  pelajeClaro:  0x3a2f57,
  contorno:     0x6d5bd0,
  lavanda:      0xa78bfa,
  lavandaSuave: 0xd6c9ff,
  rosa:         0xf0abfc,
  rubor:        0xc084fc,
  blanco:       0xffffff,
};

const escenario = document.getElementById('escenario');
const etiqueta  = document.getElementById('etiqueta');
const botones   = document.querySelectorAll('.demo button');

const menosMovimiento = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   Escena
   ============================================================ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
} catch (e) {
  mostrarFallback();
}

function mostrarFallback() {
  const aviso = document.createElement('p');
  aviso.className = 'sin-webgl';
  aviso.textContent = 'Este navegador no puede dibujar la cara de Vibi: necesita WebGL.';
  escenario.appendChild(aviso);
}

if (renderer) {
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(escenario.clientWidth, escenario.clientHeight, false);
  escenario.appendChild(renderer.domElement);

  const escena = new THREE.Scene();

  const camara = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
  camara.position.set(0, 0.1, 8.2);
  camara.lookAt(0, 0.05, 0);

  // ambiente flojo a propósito: si sube mucho, aplana las bandas del toon
  escena.add(new THREE.AmbientLight(PALETA.contorno, 0.6));

  const luzPrincipal = new THREE.DirectionalLight(0xfff4ff, 2.0);
  luzPrincipal.position.set(2.5, 3, 4);
  escena.add(luzPrincipal);

  const luzContra = new THREE.DirectionalLight(PALETA.lavanda, 1.2);
  luzContra.position.set(-3.5, 0.6, -2);
  escena.add(luzContra);

  /* ==========================================================
     Materiales: toon con gradient map generado en memoria
     ========================================================== */
  const mapaToon = (() => {
    const niveles = 3;
    const datos = new Uint8Array(niveles);
    for (let i = 0; i < niveles; i++) datos[i] = Math.round((i / (niveles - 1)) * 255);
    const tex = new THREE.DataTexture(datos, niveles, 1, THREE.RedFormat);
    tex.minFilter = THREE.NearestFilter;
    tex.magFilter = THREE.NearestFilter;
    tex.generateMipmaps = false;
    tex.needsUpdate = true;
    return tex;
  })();

  const matToon = (color) => new THREE.MeshToonMaterial({ color, gradientMap: mapaToon });
  const matPlano = (color, opacidad = 1) => new THREE.MeshBasicMaterial({
    color, transparent: opacidad < 1, opacity: opacidad,
  });

  /* Contorno estilo cel-shading: casco invertido como hijo de la
     malla, así hereda cualquier transformación que le apliquemos. */
  function contornear(malla, grosor = 1.07) {
    const contorno = new THREE.Mesh(
      malla.geometry,
      new THREE.MeshBasicMaterial({ color: PALETA.contorno, side: THREE.BackSide })
    );
    contorno.scale.setScalar(grosor);
    malla.add(contorno);
    return contorno;
  }

  /* ==========================================================
     La gata
     ========================================================== */
  const gata = new THREE.Group();
  escena.add(gata);

  // --- cabeza: un pelín más ancha que alta = más kawaii ---
  const cabeza = new THREE.Mesh(new THREE.SphereGeometry(1.4, 56, 40), matToon(PALETA.pelaje));
  cabeza.scale.set(1.06, 1.0, 0.9);
  contornear(cabeza, 1.05);
  gata.add(cabeza);

  // --- hocico: el bultito que la convierte en gata y no en pelota ---
  const hocico = new THREE.Mesh(new THREE.SphereGeometry(0.52, 32, 24), matToon(PALETA.pelajeClaro));
  hocico.scale.set(1.05, 0.72, 0.62);
  hocico.position.set(0, -0.34, 1.02);
  gata.add(hocico);

  // --- orejas: pivote en la base para que el giro salga natural ---
  function crearOreja(lado) {
    const pivote = new THREE.Group();
    pivote.position.set(0.82 * lado, 0.95, 0.12);
    pivote.rotation.z = -0.3 * lado;
    pivote.rotation.x = -0.16;

    const externa = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.05, 4), matToon(PALETA.pelaje));
    externa.position.y = 0.5;
    externa.rotation.y = Math.PI / 4;
    contornear(externa, 1.08);
    pivote.add(externa);

    const interna = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.62, 4), matPlano(PALETA.lavanda, 0.42));
    interna.position.set(0, 0.42, 0.14);
    interna.rotation.y = Math.PI / 4;
    pivote.add(interna);

    gata.add(pivote);
    return pivote;
  }
  const orejaIzq = crearOreja(-1);
  const orejaDer = crearOreja(1);

  // --- ojos: grandes, con doble brillo, como en la versión SVG ---
  function crearOjo(lado) {
    const ojo = new THREE.Group();                 // escala → parpadeo y entrecerrar
    ojo.position.set(0.52 * lado, 0.16, 1.1);
    ojo.rotation.y = 0.34 * lado;

    const interior = new THREE.Group();            // posición → mirada
    ojo.add(interior);

    const globo = new THREE.Mesh(new THREE.SphereGeometry(0.23, 32, 24), matPlano(PALETA.lavanda));
    globo.scale.set(1, 1.24, 0.5);
    interior.add(globo);

    const brillo1 = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), matPlano(PALETA.blanco));
    brillo1.position.set(0.08 * lado, 0.1, 0.14);
    brillo1.scale.z = 0.5;
    interior.add(brillo1);

    const brillo2 = new THREE.Mesh(new THREE.SphereGeometry(0.042, 16, 12), matPlano(PALETA.lavandaSuave));
    brillo2.position.set(-0.07 * lado, -0.11, 0.14);
    brillo2.scale.z = 0.5;
    interior.add(brillo2);

    gata.add(ojo);
    return { ojo, interior };
  }
  const ojoIzq = crearOjo(-1);
  const ojoDer = crearOjo(1);

  // --- ojos felices ^ ^ (solo al hablar) ---
  function crearArco(lado) {
    const arco = new THREE.Mesh(
      new THREE.TorusGeometry(0.2, 0.04, 10, 28, Math.PI),
      matPlano(PALETA.lavanda)
    );
    arco.position.set(0.52 * lado, 0.14, 1.18);
    arco.rotation.y = 0.34 * lado;
    arco.visible = false;
    gata.add(arco);
    return arco;
  }
  const arcoIzq = crearArco(-1);
  const arcoDer = crearArco(1);

  // --- mejillas ---
  function crearRubor(lado) {
    const rubor = new THREE.Mesh(new THREE.SphereGeometry(0.24, 20, 16), matPlano(PALETA.rubor, 0));
    rubor.material.transparent = true;
    rubor.position.set(0.82 * lado, -0.26, 0.98);
    rubor.scale.set(1, 0.55, 0.25);
    gata.add(rubor);
    return rubor;
  }
  const ruborIzq = crearRubor(-1);
  const ruborDer = crearRubor(1);

  // --- nariz ---
  const nariz = new THREE.Mesh(new THREE.ConeGeometry(0.13, 0.14, 3), matPlano(PALETA.rosa));
  nariz.position.set(0, -0.19, 1.32);
  nariz.rotation.x = Math.PI;          // el triangulito apunta hacia abajo
  nariz.scale.z = 0.55;
  gata.add(nariz);

  // --- boca w (quieta) ---
  const bocaQuieta = new THREE.Group();
  for (const lado of [-1, 1]) {
    const curva = new THREE.Mesh(
      new THREE.TorusGeometry(0.11, 0.028, 8, 20, Math.PI),
      matPlano(PALETA.lavanda)
    );
    curva.rotation.z = Math.PI;            // la vuelve una U
    curva.position.x = 0.11 * lado;
    bocaQuieta.add(curva);
  }
  bocaQuieta.position.set(0, -0.42, 1.34);
  gata.add(bocaQuieta);

  // --- boca hablando, con lengua ---
  const bocaHablando = new THREE.Group();
  const bocaHueco = new THREE.Mesh(new THREE.SphereGeometry(0.19, 24, 18), matPlano(PALETA.lavanda));
  bocaHueco.scale.set(1, 0.92, 0.42);
  bocaHablando.add(bocaHueco);
  const lengua = new THREE.Mesh(new THREE.SphereGeometry(0.1, 16, 12), matPlano(PALETA.rosa));
  lengua.scale.set(1, 0.6, 0.5);
  lengua.position.set(0, -0.06, 0.06);
  bocaHablando.add(lengua);
  bocaHablando.position.set(0, -0.47, 1.26);
  bocaHablando.visible = false;
  gata.add(bocaHablando);

  // --- bigotes ---
  function crearBigotes() {
    const grupo = new THREE.Group();
    const geo = new THREE.CylinderGeometry(0.018, 0.007, 1, 6);
    const config = [
      { largo: 1.05, y:  0.14, giro:  0.32 },
      { largo: 1.15, y:  0.00, giro:  0.06 },
      { largo: 1.00, y: -0.15, giro: -0.26 },
    ];
    for (const { largo, y, giro } of config) {
      const pivote = new THREE.Group();
      pivote.position.y = y;
      pivote.rotation.z = giro;
      const malla = new THREE.Mesh(geo, matPlano(PALETA.contorno));
      malla.scale.y = largo;
      malla.rotation.z = Math.PI / 2;      // el cilindro pasa a tumbarse sobre X
      malla.position.x = -largo / 2;       // crece hacia -X desde el pivote
      pivote.add(malla);
      grupo.add(pivote);
    }
    return grupo;
  }
  const bigotesIzq = crearBigotes();
  bigotesIzq.position.set(-0.78, -0.22, 0.95);
  bigotesIzq.rotation.y = -0.55;
  gata.add(bigotesIzq);

  const bigotesDer = crearBigotes();
  bigotesDer.position.set(0.78, -0.22, 0.95);
  bigotesDer.rotation.y = 0.55;
  bigotesDer.scale.x = -1;                 // espejo
  gata.add(bigotesDer);

  // --- chispa en la frente ---
  const chispa = new THREE.Mesh(new THREE.OctahedronGeometry(0.19), matPlano(PALETA.lavanda));
  chispa.scale.set(0.5, 1, 0.5);
  chispa.position.set(0, 1.16, 0.66);
  gata.add(chispa);

  // --- puntos de pensar ---
  const puntos = new THREE.Group();
  const puntosBaseY = [];
  [[1.55, 0.8, 0.06], [1.88, 1.12, 0.08], [2.24, 1.5, 0.1]].forEach(([x, y, r]) => {
    const punto = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), matPlano(PALETA.lavanda, 0));
    punto.material.transparent = true;
    punto.position.set(x, y, 0.2);
    puntosBaseY.push(y);
    puntos.add(punto);
  });
  escena.add(puntos);

  // --- anillo de escucha ---
  const anillo = new THREE.Mesh(
    new THREE.TorusGeometry(1.95, 0.022, 8, 96),
    matPlano(PALETA.lavanda, 0)
  );
  anillo.material.transparent = true;
  anillo.position.z = -0.2;
  escena.add(anillo);

  /* ==========================================================
     Poses: cada estado fija destinos numéricos y el bucle
     interpola hacia ellos. Nada de saltos secos.
     ========================================================== */
  const POSES = {
    idle: {
      cabezaZ: 0,     cabezaX: 0,
      orejas: 0,      ojoX: 1,     ojoY: 1,
      miradaX: 0,     miradaY: 0,
      rubor: 0,       feliz: 0,    hablando: 0,
      puntos: 0,      anillo: 0,
      bobAmp: 0.09,   bobVel: 1.2,
    },
    listening: {
      cabezaZ: 0.1,   cabezaX: 0.02,
      orejas: 0.26,   ojoX: 1.18,  ojoY: 1.2,
      miradaX: 0,     miradaY: 0.01,
      rubor: 0.4,     feliz: 0,    hablando: 0,
      puntos: 0,      anillo: 1,
      bobAmp: 0.05,   bobVel: 1.9,
    },
    thinking: {
      cabezaZ: -0.07, cabezaX: -0.07,
      orejas: -0.14,  ojoX: 1,     ojoY: 0.5,
      miradaX: 0.045, miradaY: 0.05,
      rubor: 0,       feliz: 0,    hablando: 0,
      puntos: 1,      anillo: 0,
      bobAmp: 0.05,   bobVel: 0.75,
    },
    speaking: {
      cabezaZ: 0,     cabezaX: 0.03,
      orejas: 0.1,    ojoX: 1,     ojoY: 1,
      miradaX: 0,     miradaY: 0,
      rubor: 0.6,     feliz: 1,    hablando: 1,
      puntos: 0,      anillo: 0,
      bobAmp: 0.11,   bobVel: 5.2,
    },
  };

  const actual = { ...POSES.idle };
  let estado = 'idle';

  // vida propia en idle
  let parpadeo = 1;          // 1 abierto, 0 cerrado
  let proximoParpadeo = 2.5;
  let miradaLibre = { x: 0, y: 0 };
  let proximaMirada = 4.8;
  let flickOreja = 0;
  let proximoFlick = 6;

  const lerp = (a, b, t) => a + (b - a) * t;

  function animar(t, dt) {
    // --- interpolación hacia la pose del estado ---
    const destino = POSES[estado];
    const k = menosMovimiento ? 1 : Math.min(1, dt * 5);
    for (const clave in destino) actual[clave] = lerp(actual[clave], destino[clave], k);

    // --- vida ambiental (se apaga con prefers-reduced-motion) ---
    let bob = 0, rebote = 0, temblorBigotes = 0, aperturaBoca = 1;

    if (!menosMovimiento) {
      bob = Math.sin(t * actual.bobVel) * actual.bobAmp;
      if (estado === 'speaking') rebote = Math.abs(Math.sin(t * 5.2)) * 0.035;

      // parpadeo: solo cuando los ojos están abiertos y relajados
      if (estado === 'idle' || estado === 'listening') {
        proximoParpadeo -= dt;
        if (proximoParpadeo <= 0) { proximoParpadeo = 3 + Math.random() * 3; parpadeo = 0; }
        parpadeo = Math.min(1, parpadeo + dt * 9);
      } else {
        parpadeo = 1;
      }

      // mirar de reojo
      if (estado === 'idle') {
        proximaMirada -= dt;
        if (proximaMirada <= 0) {
          proximaMirada = 3.5 + Math.random() * 3;
          miradaLibre = { x: (Math.random() - 0.5) * 0.09, y: (Math.random() - 0.5) * 0.04 };
          setTimeout(() => { miradaLibre = { x: 0, y: 0 }; }, 1100);
        }
        // flick de oreja aleatorio, gesto gato 100%
        proximoFlick -= dt;
        if (proximoFlick <= 0) { proximoFlick = 5 + Math.random() * 5; flickOreja = 1; }
      } else {
        miradaLibre = { x: 0, y: 0 };
      }
      flickOreja = Math.max(0, flickOreja - dt * 3.2);

      if (estado === 'speaking') {
        aperturaBoca = 0.32 + (Math.sin(t * 12) * 0.5 + 0.5) * 0.68;
        temblorBigotes = Math.sin(t * 6.5) * 0.09;
      }

      chispa.rotation.y = t * 1.1;
      chispa.rotation.z = Math.sin(t * 1.6) * 0.35;
      const brilloChispa = 0.85 + Math.sin(t * (estado === 'listening' ? 4.2 : 1.7)) * 0.25;
      chispa.scale.set(0.5 * brilloChispa, brilloChispa, 0.5 * brilloChispa);
    }

    // --- aplicar a la escena ---
    gata.position.y = bob + rebote;
    gata.rotation.z = actual.cabezaZ + (menosMovimiento ? 0 : Math.sin(t * 0.7) * 0.012);
    gata.rotation.x = actual.cabezaX;

    const flick = flickOreja * -0.5;
    orejaIzq.rotation.z = -0.3 + actual.orejas + flick;
    orejaDer.rotation.z =  0.3 - actual.orejas;

    const mostrarFelices = actual.feliz > 0.5;
    for (const { ojo, interior } of [ojoIzq, ojoDer]) {
      ojo.visible = !mostrarFelices;
      ojo.scale.set(actual.ojoX, actual.ojoY * parpadeo, 1);
      interior.position.x = actual.miradaX + miradaLibre.x;
      interior.position.y = actual.miradaY + miradaLibre.y;
    }
    arcoIzq.visible = arcoDer.visible = mostrarFelices;

    ruborIzq.material.opacity = ruborDer.material.opacity = actual.rubor;

    const hablando = actual.hablando > 0.5;
    bocaQuieta.visible = !hablando;
    bocaHablando.visible = hablando;
    bocaHablando.scale.set(1, aperturaBoca, 1);
    // en thinking la boca se tuerce, igual que en la versión SVG
    bocaQuieta.rotation.z = actual.puntos * -0.22;
    bocaQuieta.position.x = actual.puntos * 0.05;

    bigotesIzq.rotation.z =  temblorBigotes + actual.puntos * -0.08;
    bigotesDer.rotation.z = -temblorBigotes + actual.puntos * 0.08;

    puntos.visible = actual.puntos > 0.02;
    puntos.children.forEach((punto, i) => {
      punto.material.opacity = actual.puntos * (menosMovimiento ? 0.8 : (0.35 + (Math.sin(t * 4.6 - i * 0.7) * 0.5 + 0.5) * 0.65));
      punto.position.y = puntosBaseY[i] + (menosMovimiento ? 0 : Math.sin(t * 4.6 - i * 0.7) * 0.13);
    });

    anillo.visible = actual.anillo > 0.02;
    if (anillo.visible) {
      const fase = menosMovimiento ? 0.3 : (t * 0.72) % 1;
      anillo.scale.setScalar(0.9 + fase * 0.26);
      anillo.material.opacity = actual.anillo * (1 - fase) * 0.6;
    }
  }

  /* ==========================================================
     Bucle y ajuste de tamaño
     ========================================================== */
  let anterior = 0;
  renderer.setAnimationLoop((ms) => {
    const t = ms / 1000;
    const dt = Math.min(0.05, t - anterior);
    anterior = t;
    animar(t, dt);
    renderer.render(escena, camara);
  });

  function ajustar() {
    const { clientWidth: w, clientHeight: h } = escenario;
    if (!w || !h) return;
    camara.aspect = w / h;
    camara.updateProjectionMatrix();
    renderer.setSize(w, h, false);
  }
  new ResizeObserver(ajustar).observe(escenario);
  ajustar();

  /* ==========================================================
     API pública: en la PWA el WebSocket llama a setEstado(...)
     ========================================================== */
  function setEstado(nuevo) {
    if (!POSES[nuevo]) return;
    estado = nuevo;
    escenario.className = 'escenario' + (nuevo === 'idle' ? '' : ' ' + nuevo);
    etiqueta.textContent = nuevo;
    botones.forEach((b) => b.classList.toggle('activo', b.dataset.estado === nuevo));
  }
  botones.forEach((b) => b.addEventListener('click', () => setEstado(b.dataset.estado)));
  window.setEstado = setEstado;
}
</script>

</body>
</html>
